[project]
name = "repo-reviewer"
version = "0.1.0"
description = "Multi-agent AI code review with a hallucination-filtering Verifier"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["workdir", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "RUF", "C90", "ISC"]
ignore = [
    "S603",  # subprocess with a list of args: intended (never shell=True)
    "S607",  # "git" from PATH: intended
    "RUF001", "RUF003",  # "·", "→", "−" in report text are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S103", "S105", "S106", "S108"]  # S103: tests simulate attacker-planted permissive dirs

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
# roots/list is deprecated in the 2026-07-28 MCP spec but still sent by current clients (see src/mcp_server/tools.py)
filterwarnings = ["ignore:The roots capability is deprecated"]
