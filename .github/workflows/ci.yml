name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # Semgrep pins mcp==1.29.0 and the MCP server needs mcp 2.x, so Semgrep gets its own venv
        # (found automatically at .venv-semgrep/).
        run: |
          python -m pip install -r requirements-dev.txt
          python -m venv .venv-semgrep
          .venv-semgrep/bin/pip install -r requirements-semgrep.txt
      - name: Lint
        run: ruff check .
      - name: Test (no network or API key needed; the LLM is faked)
        run: pytest -q
